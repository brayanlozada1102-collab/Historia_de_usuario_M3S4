<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Product Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           VARIABLES Y RESET
        ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0d0d0d;
            --surface:   #161616;
            --border:    #2a2a2a;
            --accent:    #c8f135;
            --accent-dim:#8aaa20;
            --text:      #e8e8e8;
            --muted:     #666;
            --danger:    #ff4c4c;
            --success:   #c8f135;
            --radius:    4px;
            --mono:      'IBM Plex Mono', monospace;
            --display:   'Syne', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--display);
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        /* ============================================================
           HEADER
        ============================================================ */
        header {
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent);
        }

        .header-tag {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 0.3rem 0.6rem;
            border-radius: 2px;
        }

        /* ============================================================
           LAYOUT PRINCIPAL
        ============================================================ */
        main {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 0;
        }

        /* ============================================================
           PANEL IZQUIERDO — FORMULARIO
        ============================================================ */
        .panel-form {
            border-right: 1px solid var(--border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-form h2 {
            font-size: 0.75rem;
            font-family: var(--mono);
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ── Campos del formulario ── */
        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .field label {
            font-size: 0.75rem;
            font-family: var(--mono);
            color: var(--muted);
            letter-spacing: 0.08em;
        }

        .field input,
        .field textarea {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.9rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s;
            resize: none;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: var(--accent);
        }

        .field input.error,
        .field textarea.error {
            border-color: var(--danger);
        }

        .field-error {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--danger);
            min-height: 1em;
        }

        /* ── Botón agregar ── */
        #btn-add {
            background: var(--accent);
            color: #0d0d0d;
            border: none;
            font-family: var(--display);
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.85rem 1.5rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        #btn-add:hover  { background: #d9ff4a; }
        #btn-add:active { transform: scale(0.98); }

        /* ── Mensaje de estado ── */
        #status-msg {
            font-family: var(--mono);
            font-size: 0.75rem;
            padding: 0.6rem 0.8rem;
            border-radius: var(--radius);
            min-height: 2.4rem;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #status-msg.show       { opacity: 1; }
        #status-msg.msg-success { background: #1a2a00; color: var(--success); border: 1px solid var(--accent-dim); }
        #status-msg.msg-error   { background: #2a0000; color: var(--danger);  border: 1px solid var(--danger); }
        #status-msg.msg-info    { background: #1a1a00; color: #ffd966;        border: 1px solid #665500; }

        /* ── Botón sincronizar ── */
        #btn-sync {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: border-color 0.2s, color 0.2s;
        }

        #btn-sync:hover { border-color: var(--accent); color: var(--accent); }

        #btn-sync .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--muted);
            transition: background 0.2s;
        }

        #btn-sync:hover .dot { background: var(--accent); }
        #btn-sync.syncing .dot {
            background: #ffd966;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ============================================================
           PANEL DERECHO — LISTA
        ============================================================ */
        .panel-list {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-header h2 {
            font-size: 0.75rem;
            font-family: var(--mono);
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        #product-count {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 0.2rem 0.5rem;
            border-radius: 2px;
        }

        /* ── Lista UL ── */
        #product-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        /* ── Item LI ── */
        #product-list li {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.25rem;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: start;
            gap: 1rem;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .product-info .product-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }

        .product-info .product-price {
            font-family: var(--mono);
            font-size: 0.85rem;
            color: var(--accent);
        }

        .product-info .product-desc {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.3rem;
        }

        .product-info .product-id {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: #444;
            margin-top: 0.5rem;
        }

        /* ── Acciones del item ── */
        .item-actions {
            display: flex;
            gap: 0.4rem;
        }

        .btn-edit,
        .btn-delete {
            border: none;
            font-family: var(--mono);
            font-size: 0.7rem;
            padding: 0.35rem 0.65rem;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-edit   { background: #1e2a00; color: var(--accent); }
        .btn-edit:hover { background: #2a3d00; }

        .btn-delete { background: #2a0000; color: var(--danger); }
        .btn-delete:hover { background: #3d0000; }

        /* ── Estado vacío ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            color: var(--muted);
            gap: 0.75rem;
        }

        .empty-state .icon { font-size: 2.5rem; }
        .empty-state p { font-family: var(--mono); font-size: 0.8rem; }

        /* ============================================================
           FOOTER
        ============================================================ */
        footer {
            border-top: 1px solid var(--border);
            padding: 1rem 2rem;
            font-family: var(--mono);
            font-size: 0.65rem;
            color: #444;
            display: flex;
            justify-content: space-between;
        }

        /* ============================================================
           MODAL EDITAR
        ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.hidden { display: none; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .modal-box h3 {
            font-size: 0.75rem;
            font-family: var(--mono);
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-save {
            flex: 1;
            background: var(--accent);
            color: #0d0d0d;
            border: none;
            font-family: var(--display);
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.75rem;
            border-radius: var(--radius);
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 0.75rem;
            padding: 0.75rem;
            border-radius: var(--radius);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ============================================================
         HEADER
    ============================================================ -->
    <header>
        <h1>Product <span>Manager</span></h1>
        <span class="header-tag">localStorage + JSON Server</span>
    </header>

    <!-- ============================================================
         CONTENIDO PRINCIPAL
    ============================================================ -->
    <main>

        <!-- Panel izquierdo: formulario para agregar/editar productos -->
        <aside class="panel-form">
            <h2>// Nuevo producto</h2>

            <!-- Formulario de captura de datos -->
            <div class="field">
                <label for="input-name">Nombre</label>
                <input type="text" id="input-name" placeholder="ej. Laptop Dell XPS" />
                <span class="field-error" id="err-name"></span>
            </div>

            <div class="field">
                <label for="input-price">Precio (USD)</label>
                <input type="number" id="input-price" placeholder="ej. 1299.99" min="0" step="0.01"/>
                <span class="field-error" id="err-price"></span>
            </div>

            <div class="field">
                <label for="input-desc">Descripción</label>
                <textarea id="input-desc" rows="3" placeholder="ej. 16GB RAM, SSD 512GB"></textarea>
                <span class="field-error" id="err-desc"></span>
            </div>

            <!-- Botón para agregar al DOM y localStorage -->
            <button id="btn-add">+ Agregar producto</button>

            <!-- Mensaje de éxito / error / info -->
            <div id="status-msg"></div>

            <!-- Botón para sincronizar con la API (JSON Server) -->
            <button id="btn-sync">
                <span class="dot"></span>
                Sincronizar con API
            </button>
        </aside>

        <!-- Panel derecho: lista de productos -->
        <section class="panel-list">
            <div class="list-header">
                <h2>// Productos</h2>
                <span id="product-count">0 items</span>
            </div>

            <!-- Lista donde se renderizan los productos dinámicamente -->
            <ul id="product-list"></ul>
        </section>

    </main>

    <!-- ============================================================
         FOOTER
    ============================================================ -->
    <footer>
        <span>product-manager v1.0</span>
        <span id="footer-storage">localStorage: 0 items</span>
    </footer>

    <!-- ============================================================
         MODAL EDITAR
    ============================================================ -->
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>// Editar producto</h3>

            <div class="field">
                <label>Nombre</label>
                <input type="text" id="edit-name" />
            </div>
            <div class="field">
                <label>Precio (USD)</label>
                <input type="number" id="edit-price" min="0" step="0.01"/>
            </div>
            <div class="field">
                <label>Descripción</label>
                <textarea id="edit-desc" rows="3"></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn-save" id="btn-save-edit">Guardar</button>
                <button class="btn-cancel" id="btn-cancel-edit">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- app.js enlazado como módulo ES -->
    <script type="module" src="app.js"></script>

</body>
</html>
